name: Construir app Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Compilar APK
        run: gradle -p android assembleRelease -PvCode=${{ github.run_number }} --no-daemon
      - name: Publicar descarga
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TorreControl.apk
          gh release delete apk -y --cleanup-tag || true
          gh release create apk TorreControl.apk --title "Torre de Control · Android" --notes "Instalar en Android: descargar TorreControl.apk y abrirlo. Versión ${{ github.run_number }}."
